<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teaching - Lorenzo Liverani</title>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            font-size: 1.0625rem;
            line-height: 1.65;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(64, 64, 64, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(82, 82, 82, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(113, 113, 122, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            background: var(--panel);
            backdrop-filter: blur(10px);
            border-radius: 0px;
            padding: 2rem 1.5rem;
            box-shadow: 0 10px 10px var(--shadow);
            border: 1px solid var(--border);
        }

        .page-title {
            text-align: center;
            padding: 0 0 1.5rem 0;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2.4rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .page-title h1 {
            font-size: 2.2rem;
        }


        .courses {
            display: grid;
            gap: 0.55rem;
            margin: 1.5rem 0;
        }

        /* Title and badges share the top row; everything below spans both
           columns. The cards are built in JS, so this is done with grid
           placement rather than an extra wrapper element. */
        .course-card {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            column-gap: 1rem;
            row-gap: 0.4rem;
            background: var(--card-plain);
            padding: 0.75rem 1.25rem;
            box-shadow: 0 2px 4px var(--shadow);
            border: 1px solid var(--border);
        }

        .course-card > p,
        .course-card > .lock,
        .course-card > .lock-error,
        .course-card > .materials {
            grid-column: 1 / -1;
        }

        .course-card h2 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .course-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-bottom: 0;
        }

        .course-tag {
            padding: 0.3rem 0.8rem;
            background: var(--badge);
            color: var(--badge-text);
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--border-strong);
        }

        .course-card p {
            color: var(--text-soft);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 0.3rem;
        }

        .lock {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem;
        }

        .lock input {
            padding: 0.6rem 0.9rem;
            background: var(--input-bg);
            border: 1px solid var(--border-strong);
            border-radius: 0px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            min-width: 220px;
        }

        .lock input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .lock button {
            padding: 0.6rem 1.5rem;
            background: var(--btn);
            color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: 0px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lock button:hover {
            background: var(--btn-hover);
            color: var(--btn-hover-text);
        }

        .ask-password {
            color: var(--accent);
            font-weight: 600;
            text-decoration: underline;
        }

        .ask-password:hover {
            color: var(--accent-hover);
        }

        .lock-error {
            color: var(--error-text);
            font-weight: 600;
            margin-top: 0.75rem;
            display: none;
        }

        .materials {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-strong);
        }

        .materials ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .materials a {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--btn);
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid var(--border-strong);
            transition: all 0.3s ease;
        }

        .materials a:hover {
            background: var(--btn-hover);
            color: var(--btn-hover-text);
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            padding: 1.25rem;
            background: var(--panel);
            backdrop-filter: blur(20px);
            color: var(--text-muted);
            font-weight: 500;
            border: 1px solid var(--border);
        }

        footer a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 1rem 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .page-title h1 {
                font-size: 1.6rem;
            }

            .course-card {
                grid-template-columns: minmax(0, 1fr);
                padding: 0.9rem 1.25rem;
            }

            .course-meta {
                justify-content: flex-start;
            }

            .lock input {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="site-header-inner">
                <h1><a href="index.html">Lorenzo Liverani</a></h1>
                <nav class="site-nav">
                    <ul>
                        <li class="dropdown">
                            <a href="index.html">Home</a>
                            <ul class="dropdown-menu">
                                <li><a href="index.html#publications">Research</a></li>
                                <li><a href="index.html#contact">Contact</a></li>
                            </ul>
                        </li>
                        <li><a href="publications.html">Publications</a></li>
                        <li><a href="teaching.html">Teaching</a></li>
                        <li><a href="CV.html">CV</a></li>
                        <li><a href="tools.html">Tools</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <div class="page-title">
            <h1>Teaching</h1>
        </div>


        <div class="courses" id="courses"></div>

        <footer>
            <p>&copy; 2025 Lorenzo Liverani | <a href="mailto:lorenzo.liverani@univie.ac.at">Contact</a></p>
        </footer>
    </div>

    <script>
        // Passwords are stored as SHA-256 hashes: this is a basic barrier, not real security.
        // To change a password, replace "hash" with the SHA-256 digest of the new one, e.g.
        //   echo -n "newpassword" | sha256sum
        const COURSES = [
            {
                title: "Mathematics for Engineers I and II",
                tags: ["FAU Erlangen-Nürnberg", "2025 – 2026"],
                description: "Exercise classes for the two-semester calculus and linear algebra sequence for engineering students.",
                hash: "67e10ff739783d5391797d604bbc5385210cf40382c3100a8e1d1235928ad494",
                materials: [
                    { label: "Exercise sheets", url: "teaching/mfe12/exercise-sheets.pdf" },
                    { label: "Solutions", url: "teaching/mfe12/solutions.pdf" }
                ]
            },
            {
                title: "Mathematics for Engineers III",
                tags: ["FAU Erlangen-Nürnberg", "2024 – 2025"],
                description: "Complex analysis, Fourier analysis and partial differential equations for engineering students.",
                hash: "072e87154644a1969dddbed9f3f46ce7a6585f58d6fd956cee5411bc3326aef7",
                materials: [
                    { label: "Lecture notes", url: "teaching/mfe3/lecture-notes.pdf" },
                    { label: "Exercise sheets", url: "teaching/mfe3/exercise-sheets.pdf" }
                ]
            },
            {
                title: "Equazioni Differenziali",
                tags: ["Politecnico di Milano", "2023"],
                description: "Ordinary differential equations for the B.Sc. in Civil Engineering.",
                hash: "37856070ad6b1ffbfc13539b0ca245b57e511f541b01caf89db65b383734e7ca",
                materials: [
                    { label: "Esercizi", url: "teaching/edo/esercizi.pdf" }
                ]
            },
            {
                title: "Analisi Matematica 1",
                tags: ["Politecnico di Milano", "2019 – 2024"],
                description: "Exercise classes for the B.Sc. in Mathematical Engineering (four academic years) and for the B.Sc. in Civil Engineering (one academic year).",
                hash: "83b67ec9f80d6d2fccb9aff0e6c6ea40837cc182221ce04d97a300d3af3bd1ef",
                materials: [
                    { label: "Esercizi svolti", url: "teaching/analisi1/esercizi-svolti.pdf" },
                    { label: "Temi d'esame", url: "teaching/analisi1/temi-esame.pdf" }
                ]
            },
            {
                title: "Introduction to MATLAB and Simulink",
                tags: ["Politecnico di Milano", "November 2022"],
                description: "Intensive course on numerical computing with MATLAB and dynamical system simulation with Simulink.",
                hash: "869f6eedb2a15fc8f9dc875ebdecd18bfbbf3b9d119a2dca6ef9492f203f740d",
                materials: [
                    { label: "Slides", url: "teaching/matlab/slides.pdf" },
                    { label: "Scripts", url: "teaching/matlab/scripts.zip" }
                ]
            }
        ];

        const EMAIL = "lorenzo.liverani@univie.ac.at";

        async function sha256(text) {
            const data = new TextEncoder().encode(text);
            const digest = await crypto.subtle.digest("SHA-256", data);
            return Array.from(new Uint8Array(digest))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        function buildCard(course, index) {
            const card = document.createElement("div");
            card.className = "course-card";

            const mailto = "mailto:" + EMAIL + "?subject=" +
                encodeURIComponent("Password request: " + course.title);

            card.innerHTML =
                '<h2>' + course.title + '</h2>' +
                '<div class="course-meta">' +
                course.tags.map(t => '<span class="course-tag">' + t + '</span>').join("") +
                '</div>' +
                '<p>' + course.description + '</p>' +
                '<div class="lock">' +
                '<input type="password" placeholder="Password" aria-label="Password for ' + course.title + '">' +
                '<button type="button">Unlock material</button>' +
                '<a class="ask-password" href="' + mailto + '">Contact me to get the password</a>' +
                '</div>' +
                '<div class="lock-error">Wrong password.</div>' +
                '<div class="materials"><ul>' +
                course.materials.map(m => '<li><a href="' + m.url + '">' + m.label + '</a></li>').join("") +
                '</ul></div>';

            const input = card.querySelector("input");
            const button = card.querySelector("button");
            const error = card.querySelector(".lock-error");
            const materials = card.querySelector(".materials");

            async function check() {
                let digest;
                try {
                    digest = await sha256(input.value);
                } catch (e) {
                    error.textContent = "Password check unavailable (the page must be served over https).";
                    error.style.display = "block";
                    return;
                }
                if (digest === course.hash) {
                    card.querySelector(".lock").style.display = "none";
                    error.style.display = "none";
                    materials.style.display = "block";
                } else {
                    error.textContent = "Wrong password.";
                    error.style.display = "block";
                }
            }

            button.addEventListener("click", check);
            input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });

            return card;
        }

        const list = document.getElementById("courses");
        COURSES.forEach((c, i) => list.appendChild(buildCard(c, i)));
    </script>
</body>
</html>
